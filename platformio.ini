; Bedroom alarm clock firmware
; Target: Freenove ESP32-S3 Display FNK0115Q (5" 800x480 IPS, GT911 capacitive touch).
; The 4.3" IPS FNK0115L uses the same build (it just needs an external I2S amp).

[env:fnk0115q]
; pioarduino = Arduino-ESP32 core 3.x (needed by the RGB panel driver)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino

monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
; Packs web/ (the settings page) into src/web_files.h before each build
extra_scripts = pre:tools/embed_web.py

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DCORE_DEBUG_LEVEL=2
    '-DOTA_PASSWORD="${ota.password}"'

; Libraries pinned to the versions Freenove ships and tests with this board
lib_deps =
    https://github.com/lvgl/lvgl.git#v9.5.0
    https://github.com/moononournation/Arduino_GFX.git#v1.6.5
    https://github.com/tamctec/gt911-arduino.git#b3f175e65a799368be9c544e255204e1e74ad2ed
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    https://github.com/bblanchon/ArduinoJson.git#v7.4.3

; Same firmware, sent over WiFi instead of USB:  pio run -e ota -t upload
; If alarmclock.local doesn't resolve, add  --upload-port <the clock's IP>  (the settings page shows it).
[ota]
; Change this before your first USB upload: the clock only accepts WiFi updates with it.
password = change-me

[env:ota]
extends = env:fnk0115q
upload_protocol = espota
upload_port = alarmclock.local
; A fixed port for the clock to send its replies to: the tool's random pick can land in a range
; Windows reserves for itself (WinError 10013).
upload_flags =
    --auth=${ota.password}
    --host_port=40123
