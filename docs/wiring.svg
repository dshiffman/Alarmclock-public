<text x='1090' y='326' font-size='12' text-anchor='middle' font-weight='normal' fill='#555' font-family='Helvetica, Arial, sans-serif' >Panel socket in</text>
<text x='1090' y='341' font-size='12' text-anchor='middle' font-weight='normal' fill='#555' font-family='Helvetica, Arial, sans-serif' >the back cover</text>
<polyline points='1060,270 994,270' fill='none' stroke='#888' stroke-width='6' stroke-linejoin='round' stroke-linecap='round'/>
<text x='1090' y='366' font-size='12' text-anchor='middle' font-weight='normal' fill='#555' font-family='Helvetica, Arial, sans-serif' >Inside: flat right-angle</text>
<text x='1090' y='381' font-size='12' text-anchor='middle' font-weight='normal' fill='#555' font-family='Helvetica, Arial, sans-serif' >USB-C cable to the board</text>
<rect x='1000' y='610' width='380' height='214' rx='10' fill='#fafafa' stroke='#bbb' stroke-width='1.5' stroke-dasharray='6 4'/>
<text x='1020' y='642' font-size='16' text-anchor='start' font-weight='bold' fill='#222' font-family='Helvetica, Arial, sans-serif' >Power</text>
<text x='1020' y='670' font-size='14' text-anchor='start' font-weight='normal' fill='#333' font-family='Helvetica, Arial, sans-serif' >No battery. After a power cut the clock</text>
<text x='1020' y='694' font-size='14' text-anchor='start' font-weight='normal' fill='#333' font-family='Helvetica, Arial, sans-serif' >restarts, gets the time from WiFi and rings any</text>
<text x='1020' y='718' font-size='14' text-anchor='start' font-weight='normal' fill='#333' font-family='Helvetica, Arial, sans-serif' >alarm it missed (up to 30 minutes late).</text>
<text x='1020' y='742' font-size='14' text-anchor='start' font-weight='normal' fill='#555' font-family='Helvetica, Arial, sans-serif' >Part: flat right-angle USB-C to panel-mount</text>
<text x='1020' y='766' font-size='14' text-anchor='start' font-weight='normal' fill='#555' font-family='Helvetica, Arial, sans-serif' >USB-C socket cable, 30 cm (Amazon B0FQNPK1SQ).</text>
<text x='1020' y='790' font-size='14' text-anchor='start' font-weight='normal' fill='#555' font-family='Helvetica, Arial, sans-serif' >It carries data, so uploads work through the</text>
<text x='1020' y='814' font-size='14' text-anchor='start' font-weight='normal' fill='#555' font-family='Helvetica, Arial, sans-serif' >back socket.</text>
<rect x='1000' y='835' width='380' height='118' rx='10' fill='#fafafa' stroke='#bbb' stroke-width='1.5' stroke-dasharray='6 4'/>
<text x='1020' y='867' font-size='16' text-anchor='start' font-weight='bold' fill='#222' font-family='Helvetica, Arial, sans-serif' >Free pins</text>
<text x='1020' y='895' font-size='14' text-anchor='start' font-weight='normal' fill='#555' font-family='Helvetica, Arial, sans-serif' >IO11, IO12 and IO13 (P3) are spare. P3 pin 1 is</text>
<text x='1020' y='919' font-size='14' text-anchor='start' font-weight='normal' fill='#555' font-family='Helvetica, Arial, sans-serif' >IO19 (I2C data). Leave IO17 / IO18 alone: the</text>
<text x='1020' y='943' font-size='14' text-anchor='start' font-weight='normal' fill='#555' font-family='Helvetica, Arial, sans-serif' >speaker amp uses them. Keep the SD slot empty.</text>
</svg>