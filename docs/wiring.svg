<text x='1265' y='286' font-size='12' text-anchor='middle' font-weight='normal' fill='#555' font-family='Helvetica, Arial, sans-serif' >5 V 2 A</text>
<polyline points='1180,270 1120,270' fill='none' stroke='#888' stroke-width='6' stroke-linejoin='round' stroke-linecap='round'/>
